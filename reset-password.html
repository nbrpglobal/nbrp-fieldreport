<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reset Password · NBRP GLOBAL</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .reset-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: #F8FAFC;
    }
    .reset-card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border: 1px solid #CBD5E1;
      border-radius: 12px;
      padding: 24px 20px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
    }
    .reset-card h1 {
      font-size: 18px;
      color: #0A2463;
      margin: 0 0 8px;
    }
    .reset-card .sub {
      font-size: 13px;
      color: #64748B;
      margin: 0 0 16px;
      line-height: 1.45;
    }
    .reset-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .reset-brand img { width: 32px; height: 32px; }
    .reset-brand span { font-weight: 600; color: #0A2463; font-size: 15px; }
    .reset-card .input { width: 100%; margin-bottom: 10px; }
    .reset-card .error { min-height: 18px; font-size: 13px; color: #DC2626; margin: 4px 0 8px; }
    .reset-card .error.ok { color: #059669; }
    .reset-foot { margin-top: 16px; text-align: center; font-size: 13px; }
    .reset-foot a { color: #2563EB; text-decoration: none; }
  </style>
</head>
<body>
  <div id="toastHost" class="toast-host" aria-live="polite"></div>
  <div class="reset-page">
    <div class="reset-card">
      <div class="reset-brand">
        <img src="nbrplogo.svg" alt="NBRP GLOBAL" width="32" height="32">
        <span>NBRP GLOBAL</span>
      </div>
      <h1>Set a new password</h1>
      <p class="sub" id="statusSub">Enter a new password for your Field Report account (minimum 6 characters).</p>
      <div id="resetForm">
        <input type="password" class="input" id="newPassword" placeholder="New password" autocomplete="new-password" minlength="6">
        <input type="password" class="input" id="confirmPassword" placeholder="Confirm password" autocomplete="new-password" minlength="6">
        <div class="error" id="resetPageError"></div>
        <button type="button" class="btn-primary" id="updatePasswordBtn" style="width:100%">Update password</button>
      </div>
      <div id="resetDone" style="display:none">
        <p class="sub" style="color:#059669">Your password has been updated. You can sign in with your new password.</p>
        <a class="btn-primary" href="/" style="display:block;text-align:center;text-decoration:none;padding:12px;border-radius:8px;margin-top:12px">Go to Sign In</a>
      </div>
      <p class="reset-foot"><a href="/">← Back to Field Report</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
(function () {
  "use strict";
  var SUPABASE_URL = "https://qvymejkjowrkrhrotadr.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_zS66D3dO-j5C3cwDITHZHw_BUaeqc1t";
  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showToast(message, type) {
    var host = document.getElementById("toastHost");
    if (!host) return;
    var el = document.createElement("div");
    el.className = "toast " + (type || "info");
    el.textContent = message;
    host.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 4500);
  }

  var errEl = document.getElementById("resetPageError");
  var btn = document.getElementById("updatePasswordBtn");
  var sessionReady = false;

  function setError(msg, ok) {
    errEl.textContent = msg || "";
    errEl.className = "error" + (ok ? " ok" : "");
  }

  /* Recovery links deliver tokens in the URL hash; supabase-js picks them up via detectSessionInUrl */
  supabase.auth.onAuthStateChange(function (event, session) {
    if (event === "PASSWORD_RECOVERY" || (session && event === "SIGNED_IN")) {
      sessionReady = true;
      document.getElementById("statusSub").textContent =
        "Recovery link verified. Choose a new password below.";
    }
  });

  supabase.auth.getSession().then(function (res) {
    if (res.data.session) {
      sessionReady = true;
    } else {
      /* Wait briefly for hash parsing */
      setTimeout(function () {
        supabase.auth.getSession().then(function (r2) {
          if (r2.data.session) sessionReady = true;
          else {
            setError("This reset link is invalid or has expired. Request a new one from the Sign In page.");
            btn.disabled = true;
          }
        });
      }, 800);
    }
  });

  btn.addEventListener("click", async function () {
    setError("");
    var p1 = document.getElementById("newPassword").value;
    var p2 = document.getElementById("confirmPassword").value;
    if (!p1 || p1.length < 6) {
      setError("Password must be at least 6 characters.");
      return;
    }
    if (p1 !== p2) {
      setError("Passwords do not match.");
      return;
    }
    var sess = await supabase.auth.getSession();
    if (!sess.data.session) {
      setError("This reset link is invalid or has expired. Request a new one from Sign In.");
      showToast("Reset link invalid or expired.", "error");
      return;
    }
    btn.disabled = true;
    btn.textContent = "Updating…";
    try {
      var res = await supabase.auth.updateUser({ password: p1 });
      if (res.error) {
        setError(res.error.message);
        showToast(res.error.message, "error");
        return;
      }
      document.getElementById("resetForm").style.display = "none";
      document.getElementById("resetDone").style.display = "block";
      showToast("Password updated successfully.", "success");
    } catch (e) {
      setError((e && e.message) || "Could not update password.");
      showToast((e && e.message) || "Could not update password.", "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Update password";
    }
  });
})();
  </script>
</body>
</html>
